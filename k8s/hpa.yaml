apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediahub-api-hpa
  namespace: mediahub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediahub-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mediahub-api-pdb
  namespace: mediahub
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mediahub-api
